[package]
name = "esc-passthrough"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Sans-IO codecs for letting the AM32 configurator reach ESCs through a flight controller: MSP v1, the four-way interface and the AM32 bootloader byte sequences. No I/O."
repository = "https://github.com/Lmx154/esc-passthrough"
readme = "README.md"
keywords = ["embedded", "no-std", "esc", "msp", "am32"]
categories = ["embedded", "no-std", "no-std::no-alloc", "hardware-support"]
rust-version = "1.99"
exclude = ["hil/", "host/", "tools/", ".gitignore"]

[features]
defmt = ["dep:defmt"]

[dependencies]
defmt = { version = "1.0.1", optional = true }
embedded-hal-async = "1.0"
embedded-io-async = "0.7"

[dev-dependencies]
proptest = "1.12"
